# Render Blueprint — provisions the full RPM PWA stack.
# Deploy: render.com → New + → Blueprint → connect this repository.
#
# Services provisioned:
#   rpm-postgres  — managed PostgreSQL
#   rpm-redis     — managed Key Value store
#   rpm-backend   — FastAPI API (Docker, multi-stage prod image)
#   rpm-frontend  — React PWA (static site, CDN-served)

services:
  # --- Managed Redis (Key Value) ---
  - type: keyvalue
    name: rpm-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all

  # --- Backend API (FastAPI + Docker) ---
  - type: web
    name: rpm-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rpm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rpm-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://rpm-frontend-gtp3.onrender.com"]'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"

  # --- Frontend PWA (static site) ---
  - type: web
    name: rpm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rpm-backend-vezm.onrender.com/api/v1
      - key: NODE_VERSION
        value: "20"

# PostgreSQL databases are defined separately from services
databases:
  - name: rpm-postgres
    plan: free
    databaseName: rpm_db
    user: rpm_user
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all
