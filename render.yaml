# Render Blueprint — one-click setup for the RPM PWA.
# Deploy: sign in to render.com, "New +" > "Blueprint", pick this repository.
services:
  # --- Backend API (FastAPI + SQLite) ---
  - type: web
    name: rpm-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c "python scripts/render_seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/backend/rpm_prod.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://rpm-frontend.onrender.com","http://localhost:4173","http://127.0.0.1:4173","http://localhost:5173","http://127.0.0.1:5173"]'

  # --- Frontend PWA (built dist served over HTTPS) ---
  - type: web
    name: rpm-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rpm-backend.onrender.com/api/v1
      - key: NODE_VERSION
        value: "20"