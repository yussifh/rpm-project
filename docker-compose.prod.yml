version: "3.9"

# ------------------------------------------------------------------
# Production orchestration. Differences from docker-compose.yml (dev):
#   - Uses Dockerfile.prod (multi-stage, smaller images, non-root user)
#   - No source bind-mounts — the image is immutable once built
#   - Frontend is a built static bundle served by Nginx, not the Vite dev server
#   - Backend runs Gunicorn+Uvicorn workers via entrypoint.sh (which also
#     runs Alembic migrations on container start)
#   - Restart policy is `always` (dev uses `unless-stopped`) since this is
#     meant to stay up unattended
#
# This file is for a self-hosted/VPS deployment via Docker. The Render
# deployment (see render.yaml + DEPLOYMENT.md) does NOT use this file —
# Render builds each service from its own Dockerfile directly.
# ------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rpm_network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rpm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: production
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    ports:
      - "8000:8000"
    networks:
      - rpm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - rpm_network

volumes:
  postgres_data:
  redis_data:

networks:
  rpm_network:
    driver: bridge
