version: "3.9"

# ------------------------------------------------------------------
# AI-Integrated Remote Patient Monitoring System
# Local development orchestration: FastAPI + PostgreSQL + Redis + React
# ------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: rpm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpm_password}
      POSTGRES_DB: ${POSTGRES_DB:-rpm_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpm_user} -d ${POSTGRES_DB:-rpm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rpm_network

  redis:
    image: redis:7-alpine
    container_name: rpm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rpm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rpm_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rpm_user}:${POSTGRES_PASSWORD:-rpm_password}@postgres:5432/${POSTGRES_DB:-rpm_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: development
      # AI Health Assistant (optional) — leave unset to run everything
      # else normally; the assistant chat endpoint returns a clean 503
      # instead of crashing when this is empty. Set it in your .env to
      # enable real AI Assistant replies.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - rpm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - rpm_network

volumes:
  postgres_data:
  redis_data:

networks:
  rpm_network:
    driver: bridge
